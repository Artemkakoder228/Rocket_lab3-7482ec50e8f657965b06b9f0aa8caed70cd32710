<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Радар Рейдів</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            text-align: center; color: white; display: flex; flex-direction: column; 
            align-items: center; min-height: 95vh; padding: 20px 0; overflow-x: hidden; 
            background: radial-gradient(circle at center, #0a0f1e 0%, #000 100%); 
            font-family: sans-serif;
            margin: 0;
        }
        
        .header-title { font-size: 26px; font-weight: bold; color: #ff3232; text-shadow: 0 0 15px rgba(255, 50, 50, 0.8); letter-spacing: 2px; margin-top: 10px;}
        .subtitle { color: #00f3ff; font-size: 14px; font-family: monospace; margin-bottom: 20px; }

        /* Радар */
        .radar-container {
            position: relative; width: 150px; height: 150px; margin: 10px auto;
            border-radius: 50%;
            border: 2px solid rgba(0, 243, 255, 0.3);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
        }
        .radar-sweep {
            position: absolute; width: 50%; height: 2px;
            background: linear-gradient(90deg, rgba(0,243,255,0) 0%, rgba(0,243,255,1) 100%);
            top: 50%; left: 50%; transform-origin: 0% 50%;
            animation: sweep 2s linear infinite;
        }
        @keyframes sweep { 100% { transform: rotate(360deg); } }

        /* Список цілей */
        .targets-container {
            width: 90%; max-width: 400px;
            margin-top: 20px;
            text-align: left;
        }
        
        .target-card {
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.2s;
        }
        .target-card:hover { border-color: #ff3232; background: rgba(255, 50, 50, 0.05); }
        
        .target-info h4 { margin: 0 0 5px 0; color: #fff; font-size: 16px; }
        .target-info p { margin: 2px 0; font-size: 13px; color: #aaa; font-family: monospace;}
        .target-info span { color: #00f3ff; font-weight: bold; }
        .target-info .loot { color: #ffd700; }

        .attack-btn {
            background: #ff3232; color: white; border: none;
            padding: 10px 15px; border-radius: 8px; font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.5); cursor: pointer;
        }
        .attack-btn:active { transform: scale(0.95); }

        .leave-btn { 
            margin-top: 20px; width: 90%; max-width: 400px; padding: 15px; 
            background: transparent; border: 1px solid #aaa; color: #aaa; 
            border-radius: 10px; font-weight: bold; cursor: pointer; 
        }
        .loader { color: #00f3ff; font-family: monospace; font-size: 16px; margin: 20px 0; animation: pulse 1s infinite alternate;}
        @keyframes pulse { to { opacity: 0.3; } }

    </style>
</head>
<body>
    
    <div class="header-title">ТАКТИЧНИЙ РАДАР</div>
    <div class="subtitle" id="status-text">▶ Встановлення зв'язку... ◀</div>

    <div class="radar-container">
        <div class="radar-sweep"></div>
        <div style="font-size: 40px;" id="planet-icon">🌍</div>
    </div>

    <div class="loader" id="loader">> Сканування сектору...</div>

    <div class="targets-container" id="targets-list">
        </div>

    <button class="leave-btn" onclick="tg.close()">ВІДСТУПИТИ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const familyId = urlParams.get('family_id');
        const userId = urlParams.get('user_id');

        const statusText = document.getElementById('status-text');
        const targetsList = document.getElementById('targets-list');
        const loader = document.getElementById('loader');
        const planetIcon = document.getElementById('planet-icon');

        async function fetchTargets() {
            try {
                // Сервер повинен бути на тій же адресі (відносний шлях)
                const response = await fetch(`/api/raid/targets?family_id=${familyId}`);
                const data = await response.json();

                if (data.error) {
                    statusText.innerText = `Помилка: ${data.error}`;
                    loader.style.display = 'none';
                    return;
                }

                // Встановлюємо іконку планети
                const p = data.planet.toLowerCase();
                if (p === 'earth') planetIcon.innerText = '🌍';
                else if (p === 'moon') planetIcon.innerText = '🌑';
                else if (p === 'mars') planetIcon.innerText = '🔴';
                else if (p === 'jupiter') planetIcon.innerText = '🪐';

                statusText.innerText = `▶ Сектор: ${data.planet.toUpperCase()} | Ваша міць: ${data.my_power} ◀`;
                loader.style.display = 'none';

                if (data.targets.length === 0) {
                    targetsList.innerHTML = `<p style="text-align:center; color:#aaa;">У цьому секторі не виявлено гідних супротивників або всі вони знаходяться під енергетичним щитом.</p>`;
                    return;
                }

                // Малюємо картки
                data.targets.forEach(target => {
                    const card = document.createElement('div');
                    card.className = 'target-card';
                    card.innerHTML = `
                        <div class="target-info">
                            <h4>Колонія: ${target.name}</h4>
                            <p>Міць оборони: <span>${target.power} ⚔️</span></p>
                            <p>Можливий лут: <span class="loot">~${target.loot_coins} 🪙</span></p>
                        </div>
                        <button class="attack-btn" onclick="attack(${target.id}, this)">🚀 АТАКА</button>
                    `;
                    targetsList.appendChild(card);
                });

                tg.HapticFeedback.notificationOccurred('success');

            } catch (err) {
                loader.innerText = "> Помилка сканування радара!";
                console.error(err);
            }
        }

        async function attack(targetId, btnElement) {
            btnElement.disabled = true;
            btnElement.innerText = "БОЙОВА ТРИВОГА...";
            btnElement.style.background = "#555";
            tg.HapticFeedback.impactOccurred('heavy');

            try {
                const response = await fetch('/api/raid/attack', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        family_id: familyId,
                        user_id: userId,
                        target_id: targetId
                    })
                });

                const data = await response.json();
                
                // Вібруємо залежно від результату
                if(data.win) {
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    tg.HapticFeedback.notificationOccurred('error');
                }

                // Закриваємо веб-додаток, бот надішле результат бою в чат
                tg.showAlert("Бій завершено! Результати надіслані вам у закритий канал зв'язку (в чат бота).", () => {
                    tg.close();
                });

            } catch (err) {
                alert("Помилка зв'язку з командуванням.");
                btnElement.disabled = false;
                btnElement.innerText = "🚀 АТАКА";
            }
        }

        // Запускаємо сканування після невеликої затримки для краси
        setTimeout(fetchTargets, 1500);

    </script>
</body>
</html>
