<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Радар Рейдів</title>
    <link rel="stylesheet" href="CSS/Earth.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { text-align: center; color: white; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 95vh; padding: 20px 0; overflow: hidden; background: radial-gradient(circle at center, #0a0f1e 0%, #000 100%); }
        
        .header-title { font-size: 28px; font-weight: bold; color: #ff3232; text-shadow: 0 0 15px rgba(255, 50, 50, 0.8); letter-spacing: 3px; margin-top: 10px; z-index: 10;}
        .subtitle { color: #00f3ff; font-size: 16px; font-family: monospace; letter-spacing: 1px; z-index: 10; margin-bottom: 20px; animation: pulseText 1.5s infinite alternate;}

        @keyframes pulseText { 0% { opacity: 0.5; } 100% { opacity: 1; text-shadow: 0 0 10px #00f3ff; } }

        /* === ТАКТИЧНИЙ РАДАР (ПОЧАТКОВИЙ СТИЛЬ З ЛІНІЯМИ) === */
        .radar-container {
            position: relative; width: 320px; height: 320px; margin: 20px auto;
            border-radius: 50%;
            /* 🔥 ПРИБРАЛИ ЗАПОВНЕННЯ І ТІНІ, ЯКІ СТВОРЮВАЛИ ЧОРНІ КОЛА */
            background: transparent !important;
            box-shadow: none !important;
            display: flex; justify-content: center; align-items: center;
        }

        /* Орбіти ЗІ ШТРИХОВАНИМИ ЛІНІЯМИ */
        .orbit { position: absolute; border-radius: 50%; border: 1px dashed rgba(0, 243, 255, 0.4); /* Dashed lines */ }
        .orbit-1 { width: 100px; height: 100px; animation: spin 8s linear infinite; }
        .orbit-2 { width: 200px; height: 200px; border-style: dashed; animation: spin 15s linear infinite reverse; }
        .orbit-3 { width: 300px; height: 300px; border-color: rgba(255, 50, 50, 0.3); animation: spin 25s linear infinite; }

        /* Сонце та Планети */
        .sun { font-size: 40px; position: absolute; filter: drop-shadow(0 0 20px #ffaa00); z-index: 5; }
        .planet { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font-size: 20px; filter: drop-shadow(0 0 10px currentColor); }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* === АНІМАЦІЇ РАКЕТ === */
        .rocket { position: absolute; font-size: 18px; z-index: 10; opacity: 0; filter: drop-shadow(0 0 10px #ffaa00); }
        .rocket-1 { animation: fly1 4s ease-in-out infinite 1s; }
        .rocket-2 { animation: fly2 5s ease-in-out infinite 3s; }

        @keyframes fly1 {
            0% { top: 300px; left: -20px; transform: rotate(45deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: -20px; left: 300px; transform: rotate(45deg); opacity: 0; }
        }
        @keyframes fly2 {
            0% { top: 0px; left: 350px; transform: rotate(-135deg); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { top: 350px; left: -50px; transform: rotate(-135deg); opacity: 0; }
        }

        /* === ТЕРМІНАЛ ПОВІДОМЛЕНЬ === */
        .terminal {
            width: 90%; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--accent-cyan);
            border-radius: 10px; padding: 15px; font-family: monospace; color: #00ff64;
            font-size: 13px; text-align: left; height: 80px; overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 255, 100, 0.1); margin-bottom: 20px;
        }
        .log-line { margin: 3px 0; opacity: 0; animation: typeLine 0.5s forwards; }
        
        @keyframes typeLine { to { opacity: 1; } }

        .leave-btn { display: block; width: 90%; padding: 15px; background: rgba(255, 50, 50, 0.1); border: 1px solid #ff3232; color: #ff3232; border-radius: 10px; font-family: monospace; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px;}
        .leave-btn:hover { background: #ff3232; color: #000; box-shadow: 0 0 20px #ff3232; }

    </style>
</head>
<body>
    <div id="space-container"></div>
    
    <div>
        <div class="header-title">СИСТЕМА РЕЙДІВ</div>
        <div class="subtitle">▶ СТАТУС: У РОЗРОБЦІ ◀</div>
    </div>

    <div class="radar-container">
        <div class="sun">☀️</div>
        
        <div class="orbit orbit-1"><div class="planet">🌍</div></div>
        <div class="orbit orbit-2"><div class="planet">🔴</div></div>
        <div class="orbit orbit-3"><div class="planet">🪐</div></div>

        <div class="rocket rocket-1">🚀</div>
        <div class="rocket rocket-2">🚀</div>
    </div>

    <div class="terminal" id="terminal">
        <div class="log-line">> Встановлення захищеного з'єднання...</div>
    </div>

    <button class="leave-btn" onclick="window.Telegram.WebApp.close()">✖ ЗАКРИТИ РАДАР</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Імітація повідомлень радара
        const logs = [
            "> Сканування сектору Альфа...",
            "> Виявлено 3 ворожі флотилії.",
            "> Перехоплення сигналу зв'язку...",
            "> Дешифрування: [ДОСТУП ЗАБОРОНЕНО]",
            "> Підготовка нових бойових крейсерів...",
            "> Оновлення модулів озброєння...",
            "> СИСТЕМА БУДЕ АКТИВОВАНА ЗГОДОМ."
        ];

        const terminal = document.getElementById('terminal');
        let step = 0;

        function addLog() {
            if (step >= logs.length) {
                setTimeout(() => { terminal.innerHTML = ''; step = 0; addLog(); }, 3000); // Очищуємо і по колу
                return;
            }
            const line = document.createElement('div');
            line.className = 'log-line';
            line.innerText = logs[step];
            terminal.appendChild(line);
            terminal.scrollTop = terminal.scrollHeight; // Скролимо вниз
            
            if (step === logs.length - 1) tg.HapticFeedback.notificationOccurred('warning');
            
            step++;
            setTimeout(addLog, 1500 + Math.random() * 1000);
        }

        setTimeout(addLog, 1500);
    </script>
</body>
</html>
